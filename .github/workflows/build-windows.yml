# Builds Windows installer + portable .exe on every release tag.
# Download from GitHub → Releases — users only need IDPhotoAutoCropper-Setup.exe.
name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Sync installer version
        run: python packaging/sync_version.py

      - name: Run tests
        run: python -m pytest -q

      - name: Build application (folder + portable)
        run: |
          python -m PyInstaller --noconfirm packaging/pyinstaller.spec
          python -m PyInstaller --noconfirm packaging/pyinstaller-onefile.spec
          if not exist dist\portable mkdir dist\portable
          move /Y dist\IDPhotoAutoCropper.exe dist\portable\IDPhotoAutoCropper.exe

      - name: Verify folder build
        run: |
          & "dist\ID Photo Auto Cropper\ID Photo Auto Cropper.exe" --selftest

      - name: Verify portable build
        run: |
          & "dist\portable\IDPhotoAutoCropper.exe" --selftest

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IDPhotoAutoCropper-Windows
          path: |
            dist/installer/IDPhotoAutoCropper-Setup.exe
            dist/portable/IDPhotoAutoCropper.exe
            INSTALL.txt

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/IDPhotoAutoCropper-Setup.exe
            dist/portable/IDPhotoAutoCropper.exe
            INSTALL.txt
          generate_release_notes: true
